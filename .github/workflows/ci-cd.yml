# A simple CI/CD pipeline: TEST -> BUILD -> DEPLOY
name: CI/CD Pipeline

# When does the pipeline run?
on:
  push:
    branches: [main]        # on every push to main
  pull_request:
    branches: [main]        # on every PR to main (test + build only)
  workflow_dispatch:        # manual "Run workflow" button in the GitHub UI

# Permissions required to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent two deployments from running at the same time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1) CONTINUOUS INTEGRATION - run the tests
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest           # a fresh cloud VM provided by GitHub
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # 2) BUILD - compile the app (only if tests pass)
  build:
    name: 📦 Build
    needs: test                      # if tests fail, build never runs
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create production build
        run: npm run build
        env:
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_BUILD_TIME: ${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }}

      - name: Upload build output as an artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # 3) CONTINUOUS DEPLOYMENT - publish to the cloud (only on push to main)
  deploy:
    name: 🚀 Deploy
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
